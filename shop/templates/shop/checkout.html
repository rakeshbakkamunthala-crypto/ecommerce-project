<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .checkout {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .item {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .item:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .place-order:hover {
            background: #444;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="checkout">

    <h1>Checkout</h1>

    <div class="section">

        <h2>Order Summary</h2>

        {% for item in items %}

        <div class="item">
            <strong>{{ item.product.name }}</strong>

            <p>
                Quantity: {{ item.quantity }}
            </p>

            <p>
                Item Total: ₹{{ item.total_price }}
            </p>
        </div>

        {% endfor %}

        <div class="total">
            Total: ₹{{ total }}
        </div>

    </div>

    <div class="section">

        <h2>Shipping Details</h2>

        <form method="POST">

            {% csrf_token %}

            <label for="shipping_address">
                Shipping Address
            </label>

            <textarea
                id="shipping_address"
                name="shipping_address"
                placeholder="Enter your shipping address"
                required
            ></textarea>

            <label for="payment_method">
                Payment Method
            </label>

            <select
                id="payment_method"
                name="payment_method"
                required
            >
                <option value="COD">
                    Cash on Delivery
                </option>

                <option value="Razorpay">
                    Razorpay
                </option>

                <option value="Stripe">
                    Stripe
                </option>
            </select>

            <button type="submit" class="place-order">
                Place Order
            </button>

        </form>

        <a href="{% url 'cart' %}" class="back-btn">
            ← Back to Cart
        </a>

    </div>

</div>

</body>
</html>
